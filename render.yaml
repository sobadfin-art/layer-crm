services:
  - type: web
    name: moken-crm
    runtime: node
    plan: free
    # Migrations intégrées au build (pas en preDeployCommand) : cette
    # commande n'est pas supportée sur la formule gratuite des services web
    # Render ("pre-deploy command is not supported for free tier services").
    # Plus de seed au build (2026-10-20) : la base contient de vraies données,
    # et seed.js recréait à chaque déploiement les comptes de démo absents
    # (ex. directeur@moken.demo, renommé le 16/09) avec le mot de passe public
    # "moken1234". Le seed reste disponible en local uniquement (npm run seed).
    # --include=dev sur le frontend : NODE_ENV=production (défini plus bas) est
    # déjà actif pendant CETTE étape de build sur Render, or npm saute par
    # défaut les devDependencies quand NODE_ENV=production — ce qui a fait
    # échouer le tout premier déploiement ("vite: not found", vite étant une
    # devDependency, un outil de build, jamais utile à l'exécution). On force
    # donc leur installation explicitement, uniquement pour construire le
    # frontend ; le backend n'a besoin d'aucune devDependency pour tourner.
    buildCommand: "cd backend && npm install && npm run migrate && cd ../frontend && npm install --include=dev && npm run build"
    startCommand: "cd backend && npm start"
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: moken-crm-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: NODE_ENV
        value: production

databases:
  - name: moken-crm-db
    plan: free
    databaseName: moken_crm
    user: moken
